[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-segmentation"
version = "0.1.0"
description = "Online Retail Customer Segmentation with RFM and Clustering Models"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
